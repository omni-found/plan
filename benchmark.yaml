name: omni-found
id: omni_found
description: This is a Omnibenchmark implementation of the found paper benchmark
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"

# Benchmark configuration
version: "0.1.0"

# The default software environment for this benchmark.
software_backend: "conda" 
#software_backend: "apptainer" 

# Available software environments

software_environments:
  found:
    name: a conda env of found and the things it needs
    conda : envs/found.yaml
#  found:
#    name: a conda env of found and the things it needs
#    apptainer: envs/found.sif

# Stages and modules for your benchmark

stages:
  - id: DATA
    outputs:
        - id: data_ad
          path: "{dataset}_raw.h5ad"
    modules:
      - id: d
        name: "loads the benchmark datasets"
        software_environment: found
        repository:
          #url: https://github.com/omni-found/found-engine
          url: /data/mark/omb/found/found-engine
          commit: main
          entrypoint: download
        parameters:
            - dataset_name: "jakel"

  - id: EMB
    inputs:
        - data_ad
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
    modules:
      - id: embed
        name: "compute the embedding"
        software_environment: found
        repository:
          #url: https://github.com/omni-found/found-engine
          url: /data/mark/omb/found/found-engine
          commit: main
          entrypoint: embed
        parameters:
          - embed_method: "log_pca"
            dim:  30

  - id: REG
    inputs:
        - embedding_tsv
    outputs:
      - id: phats_tsv
        path: "{dataset}_phat.tsv"
      - id: regparams_json
        path: "{dataset}_regparams.json"
    modules:
      - id: regress
        name: "do the regression to get cell-level scores (phat)"
        software_environment: found
        repository:
          url: https://github.com/omni-found/found-engine
          commit: main
          entrypoint: regress
        parameters:
          - foo: "bar"

  - id: BIN
    inputs:
        - data_ad
        - embedding_tsv
        - phats_tsv
    outputs:
      - id: binarizations_tsv
        path: "{dataset}_binarization.tsv"
    modules:
      - id: binarize 
        name: "binarize the cell-level scores"
        software_environment: found
        repository:
          url: https://github.com/omni-found/found-engine
          commit: main
          entrypoint: binarize
        parameters:

  - id: MET
    inputs:
        - data_ad
        - embedding_tsv
        - phats_tsv
        - binarizations_tsv
    outputs:
      - id: metrics_json
        path: "{dataset}_metrics.json"
    modules:
      - id: evaluate
        name: "evaluate performance"
        software_environment: found
        repository:
          url: https://github.com/omni-found/found-engine
          commit: main
          entrypoint: evaluate
        parameters:
